<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Musical Garden</title>

    
    <link rel="icon" type="image/png" href="./images/icons/favicon.ico">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">


    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>

</head>

<body>
   
    <dialog id="intro-dialog">
        <p>
            Enter the musical garden, move the flower to its matching shadow.
        </p>
        
        <button id="intro-dialog-close">
            Enter Garden
        </button>

    </dialog>

    <main class="asset-tray">

        <button
         id="garden-button"
         class="garden-object" 
         data-match="flower"
         data-note="C4"
         type="button">
            <img src="images/assets/sunflower.png" alt="Flower">
        </button>

        <button
        class="garden-object"
        data-match="bee"
        data-note="G4"
        type="button">
        <img src="images/assets/bee.png" alt="Bee">
        </button>

        <button
        class="garden-object"
        data-match="bird"
        data-note="C5"
        type="button">
        <img src="images/assets/bird.png" alt="Bird">
        </button>

       <button
       class="garden-object"
       data-match="ladybug"
       data-note="E4"
       type="button">
       <img src="images/assets/ladybug.png" alt="Ladybug">
       </button>

       <button
       class="garden-object"
       data-match="snail"
       data-note="D4"
       type="button">
       <img src="images/assets/snail.png" alt="Snail">

       <button
       class="garden-object"
       data-match="purple-flower"
       data-note="A4"
       type="button">
       <img src="images/assets/purple-flower.png" alt="Purple-flower">

       <button
       class="garden-object"
       data-match="pink-tulip"
       data-note="F4"
       type="button">
       <img src="images/assets/pink-tulip.png" alt="pink-tulip">
</button>
        
    </main>
    <div class="garden">
        <div 
        id="flower-target"
        class="target" 
        data-match="flower"
        aria-hidden="true">
        <img src="images/assets/sunflower.png" alt="">
        </div>

        <div 
        class="target" 
        data-match="bee"
        aria-hidden="true">
        <img src="images/assets/bee.png" alt="">
        </div>

        <div 
        class="target" 
        data-match="bird"
        aria-hidden="true">
        <img src="images/assets/bird.png" alt="">
        </div>

        <div 
        class="target" 
        data-match="ladybug"
        aria-hidden="true">
        <img src="images/assets/ladybug.png" alt="">
        </div>

        <div
        class="target"
        data-match="snail"
        aria-hidden="true">
        <img src="images/assets/snail.png" alt="">
        </div>

        <div
        class="target"
        data-match="purple-flower"
        aria-hidden="true">
        <img src="images/assets/purple-flower.png" alt="">
        </div>

         <div
        class="target"
        data-match="pink-tulip"
        aria-hidden="true">
        <img src="images/assets/pink-tulip.png" alt="">
        </div>
    </div>    
</body>

</html>
