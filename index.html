<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Musical Garden</title>

    
    <link rel="icon" type="image/png" href="./images/icons/favicon.ico">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">


    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>

</head>

<body>
   
    <dialog id="intro-dialog">
        <p>
            Enter the musical garden, move the flower to its matching shadow.
        </p>
        
        <button id="intro-dialog-close">
            Enter Garden
        </button>

    </dialog>

    <main class="asset-tray">

        <button
         id="garden-button"
         class="garden-object" 
         data-match="flower"
         data-note="C4"
         type="button">
            <img src="images/assets/flower.png" alt="Flower">
        </button>

        <button
        class="garden-object"
        data-match="bee"
        data-note="G4"
        type="button">
        <img src="images/assets/bee.png" alt="Bee">
        </button>
        
    </main>

        <div 
        id="flower-target"
        class="target" 
        data-match="flower"
        aria-hidden="true">
        <img src="images/assets/flower.png" alt="">
        </div>

        <div 
        class="target" 
        data-match="bee"
        aria-hidden="true">
        <img src="images/assets/bee.png" alt="">
        </div>
    
</body>

</html>
