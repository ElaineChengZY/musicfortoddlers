<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Garden Prototype</title>

    <!-- Tone.js creates the sound. Our script runs after the HTML loads. -->
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="main.js" defer></script>
</head>
<body>
    <dialog id="intro-dialog" aria-labelledby="intro-dialog-message">
        <p id="intro-dialog-message">Enter the musical garden</p>

        <button id="intro-dialog-start" type="button">
            Enter Garden
        </button>
    </dialog>

    <main>
        <!-- This button will become an interactive garden object later. -->
        <button id="garden-button" data-note="D4" type="button">
            Garden Object
        </button>
    </main>
</body>
</html>
